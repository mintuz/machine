# Settings for the Remote Login commands (`./remote-login.sh`,
# `mise run remote-login*`). Pass an explicit local TOML file with
# `--config PATH` to override any key for one run; the profile is never stored
# here and is chosen per run with `--profile personal|work` (default personal).
# Everything else that setup applies is declared in mise.toml, the platform
# files mise.macos.toml and mise.linux.toml, and mise.ssh.toml.

# Remote Login (`mise run remote-login`, Mac only). List phone public key files
# from .ssh/. These source limits apply to normal post-unlock SSH, not FileVault unlock.
remote_login_public_keys = []
remote_login_sources = ["100.64.0.0/10", "fd7a:115c:a1e0::/48"]

# Per-run choices. Flags override them for one run; nothing is persisted.
revoke_remote_login = false

[steps]
remote-login = false

[mac]
brew_prefix = "/opt/homebrew"
remote_login_sshd_file = "/etc/ssh/sshd_config.d/010-remote-login.conf"
tailscale_cli = "/Applications/Tailscale.app/Contents/MacOS/Tailscale"

[linux]
brew_prefix = "/home/linuxbrew/.linuxbrew"
