[linux]
shell_path = "/usr/bin/zsh"
# A forwarded SSH_AUTH_SOCK replaces this with the literal "SSH_AUTH_SOCK" so the
# session-specific socket path is never saved.
ssh_agent_socket = "~/.1password/agent.sock"
pnpm_home = "~/.local/share/pnpm"
brew_prefix = "/home/linuxbrew/.linuxbrew"
