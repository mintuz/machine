# Optional CLI tools that are more likely to break.
# Failures are reported but do not stop the full setup.

[packages]
# Xcode project management
"brew-cask:tuist" = "latest"

[tools]
# Apple platform tooling. The xcodesorg/made tap formula builds this same
# upstream release from source; mise installs its checksummed release binary.
"aqua:XcodesOrg/xcodes" = "latest"
