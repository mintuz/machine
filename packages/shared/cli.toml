# CLI tools shared by macOS, Ubuntu, and both profiles. Failures stop setup.
#
# [packages] are installed and upgraded by Homebrew: "brew:<formula>" (use
# "brew:<owner>/<tap>/<formula>" for a third-party tap) and "brew-cask:<token>"
# (macOS only, except fonts; add greedy = true to upgrade self-updating casks).
# [tools] are mise tools recorded in the machine's global mise configuration.
# Use { os = "macos" } or { os = "linux" } when a package needs a different
# provider per platform.

[packages]
# Version control
"brew:git" = "latest"
"brew:worktrunk" = "latest"
"brew:gh" = "latest"
"brew:lazygit" = "latest"

# Core shell utilities
"brew:curl" = "latest"
"brew:wget" = "latest"
"brew:tree" = "latest"
"brew:stow" = "latest"
"brew:zellij" = "latest"
"brew:fzf" = "latest"
"brew:z" = "latest"
"brew:starship" = "latest"
"brew:thefuck" = "latest"
"brew:eza" = "latest"
"brew:bat" = "latest"
"brew:tlrc" = "latest"

# Search, data, and network tools
"brew:ripgrep" = "latest"
"brew:fd" = "latest"
"brew:jq" = "latest"
"brew:httpie" = "latest"
"brew:yt-dlp" = "latest"
"brew:aria2" = "latest"

# Python application installer
"brew:pipx" = "latest"

# Databases and infrastructure
"brew:mysql-client" = "latest"
"brew:pscale" = "latest"

# Build systems and Swift tooling
"brew:cmake" = "latest"
"brew:asciinema" = "latest"
"brew:xcbeautify" = "latest"
"brew:swiftformat" = "latest"
"brew:swift-format" = "latest"

# System monitoring
"brew:glances" = "latest"

# AI and app CLIs. These casks are macOS-only, so Linux uses the matching
# tools below.
"brew-cask:codex" = { os = "macos" }
"brew:opencode" = "latest"
"brew-cask:notion-cli" = { os = "macos" }
"brew-cask:1password-cli" = { os = "macos" }
"brew-cask:claude-code@latest" = { os = "macos", greedy = true }

[tools]
# Language runtimes and package managers
node = "lts"
pnpm = "latest"
"npm:yarn" = "latest"
deno = "latest"
go = "latest"

# Linux providers for the AI and app CLI casks above
"aqua:openai/codex" = { version = "latest", os = "linux" }
"npm:ntn" = { version = "latest", os = "linux" }
1password-cli = { version = "latest", os = "linux" }
"aqua:anthropics/claude-code" = { version = "latest", os = "linux" }
