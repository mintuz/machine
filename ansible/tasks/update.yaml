---
- name: Update all installed packages
  tags:
    - update
  block:
    - name: Update Homebrew
      community.general.homebrew:
        update_homebrew: yes
      environment: "{{ homebrew_environment }}"
      register: brew_update

    - name: Upgrade all Homebrew packages
      community.general.homebrew:
        upgrade_all: yes
      environment: "{{ homebrew_environment }}"
      register: brew_upgrade

    - name: Upgrade all Homebrew casks
      community.general.homebrew_cask:
        upgrade_all: yes
        path: /usr/local/bin:/opt/homebrew/bin:/home/linuxbrew/.linuxbrew/bin
      environment: "{{ homebrew_environment }}"
      register: cask_upgrade
      ignore_errors: true

    - name: Unlink Homebrew node after brew upgrade
      ansible.builtin.import_tasks: brew-unlink-node.yaml

    - name: Clean up Homebrew
      ansible.builtin.command: brew cleanup -s
      changed_when: true

    - name: Update npm packages globally
      ansible.builtin.shell: |
        set -eo pipefail
        export NVM_DIR="{{ ansible_facts['env']['HOME'] }}/.nvm"
        if [ -s "$(brew --prefix)/opt/nvm/nvm.sh" ]; then
          source "$(brew --prefix)/opt/nvm/nvm.sh"
        fi
        command -v npm >/dev/null 2>&1 || exit 3
        npm update -g
      args:
        executable: /bin/bash
      register: npm_update
      changed_when: npm_update.rc == 0
      failed_when: npm_update.rc not in [0, 3]
      ignore_errors: true
      tags: [runtime-update]

    - name: Update pnpm packages globally
      ansible.builtin.shell: |
        set -eo pipefail
        export NVM_DIR="{{ ansible_facts['env']['HOME'] }}/.nvm"
        if [ -s "$(brew --prefix)/opt/nvm/nvm.sh" ]; then
          source "$(brew --prefix)/opt/nvm/nvm.sh"
        fi
        export PNPM_HOME="{{ pnpm_home }}"
        export PATH="$PNPM_HOME/bin:$PNPM_HOME:$PATH"
        command -v pnpm >/dev/null 2>&1 || exit 3
        pnpm update -g
      args:
        executable: /bin/bash
      register: pnpm_update
      changed_when: pnpm_update.rc == 0
      failed_when: pnpm_update.rc not in [0, 3]
      ignore_errors: true
      tags: [runtime-update]

    - name: Update Mac App Store apps
      when: platform == 'mac'
      ansible.builtin.command: mas upgrade
      register: mas_update
      changed_when: "'No updates available' not in mas_update.stdout"
      ignore_errors: true

    - name: Update Ollama models
      ansible.builtin.shell: |
        set -eo pipefail
        command -v ollama >/dev/null 2>&1 || exit 3
        models="$(ollama list | awk 'NR > 1 {print $1}')"
        [ -n "$models" ] || exit 3
        for model in $models; do
          ollama pull "$model"
        done
      args:
        executable: /bin/bash
      register: ollama_update
      changed_when: ollama_update.rc == 0
      failed_when: ollama_update.rc not in [0, 3]
      ignore_errors: true
      tags: [runtime-update]

    - name: Display update summary
      ansible.builtin.debug:
        msg: >-
          {{ item.name }}: {{ 'failed' if item.result.failed | default(false)
          else 'skipped' if item.result.skipped | default(false) or item.result.rc | default(0) == 3
          else 'completed' }}
      loop: "{{ update_results }}"
      loop_control:
        label: "{{ item.name }}"
      tags: [runtime-update]

    - name: Fail when any update failed
      ansible.builtin.assert:
        that: not (item.result.failed | default(false))
        fail_msg: "Update failures: {{ item.name }}. See the error above."
        quiet: true
      loop: "{{ update_results }}"
      loop_control:
        label: "{{ item.name }}"
      tags: [runtime-update]
  vars:
    update_results:
      - name: Homebrew metadata
        result: "{{ brew_update | default({'skipped': true}) }}"
      - name: Homebrew formulae
        result: "{{ brew_upgrade | default({'skipped': true}) }}"
      - name: Homebrew casks
        result: "{{ cask_upgrade | default({'skipped': true}) }}"
      - name: npm globals
        result: "{{ npm_update | default({'skipped': true}) }}"
      - name: pnpm globals
        result: "{{ pnpm_update | default({'skipped': true}) }}"
      - name: Mac App Store
        result: "{{ mas_update | default({'skipped': true}) }}"
      - name: Ollama models
        result: "{{ ollama_update | default({'skipped': true}) }}"
