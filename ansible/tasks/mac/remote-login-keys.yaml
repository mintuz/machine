---
# remote_login_authorized_keys is the complete desired file, including empty.
- name: Ensure the SSH directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.ssh"
    state: directory
    mode: "0700"

- name: Read the existing authorised keys file
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.ssh/authorized_keys"
    follow: false
  register: remote_login_authorized_keys_file

- name: Refuse a linked or non-regular authorised keys file
  ansible.builtin.assert:
    that: >-
      not remote_login_authorized_keys_file.stat.exists
      or (remote_login_authorized_keys_file.stat.isreg | default(false)
          and not remote_login_authorized_keys_file.stat.islnk | default(false))
    fail_msg: The authorised keys path must be absent or a regular file, not a symbolic link.
    quiet: true

- name: Back up the existing authorised keys file
  when: >-
    remote_login_authorized_keys_file.stat.exists
    and remote_login_authorized_keys_file.stat.size | default(0) > 0
    and remote_login_authorized_keys_file.stat.checksum | default('') != remote_login_authorized_keys | hash('sha1')
    and not ansible_check_mode
  vars:
    remote_login_backup: "{{ ansible_facts['env']['HOME'] }}/.dev-setup-backups/{{ ansible_facts['date_time']['iso8601_basic'] }}/remote-login-{{ remote_login_authorized_keys_file.stat.checksum }}"
  block:
    - name: Create the Remote Login backup directory
      ansible.builtin.file:
        path: "{{ remote_login_backup }}"
        state: directory
        mode: "0700"

    - name: Copy the authorised keys file to the backup directory
      ansible.builtin.copy:
        src: "{{ ansible_facts['env']['HOME'] }}/.ssh/authorized_keys"
        dest: "{{ remote_login_backup }}/authorized_keys"
        remote_src: true
        mode: "0600"

- name: Replace the authorised keys file
  ansible.builtin.copy:
    content: "{{ remote_login_authorized_keys }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/.ssh/authorized_keys"
    mode: "0600"
