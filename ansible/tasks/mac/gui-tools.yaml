- name: Read GUI casks from selected inventories
  ansible.builtin.command:
    argv: [brew, bundle, list, --file, "{{ item }}", --cask]
  loop: "{{ package_files | select('search', '/Brewfile[.]gui(-optional)?$') | list }}"
  environment: "{{ homebrew_environment | combine({'HOMEBREW_NO_AUTO_UPDATE': '1'}) }}"
  register: brewfile_gui_casks
  changed_when: false
  tags: [install, gui, productivity]

- name: Install GUI casks
  ansible.builtin.shell: |
    set -euo pipefail
    cask={{ item | quote }}
    if brew list --cask "$cask" >/dev/null 2>&1; then
      brew upgrade --cask --greedy "$cask"
    else
      brew install --cask --adopt "$cask"
    fi
  args:
    executable: /bin/bash
  environment: "{{ homebrew_environment | combine({'HOMEBREW_NO_AUTO_UPDATE': '1'}) }}"
  loop: "{{ brewfile_gui_casks.results | selectattr('stdout_lines', 'defined') | map(attribute='stdout_lines') | flatten | unique }}"
  register: gui_cask_install
  changed_when: "'Installing' in gui_cask_install.stdout or 'Upgrading' in gui_cask_install.stdout or 'installed' in gui_cask_install.stdout"
  failed_when: false
  tags: [install, gui, productivity]

- name: Report GUI cask failures
  ansible.builtin.debug:
    msg: "{{ item.item }}: {{ item.stderr }}"
  loop: "{{ gui_cask_install.results | default([]) }}"
  when: item.rc != 0
  tags: [install, gui, productivity]
