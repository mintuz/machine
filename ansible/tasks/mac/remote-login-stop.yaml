---
# Stop accepting new SSH connections before changing access or configuration.
- name: Disable and unload Remote Login
  become: true
  when: not ansible_check_mode
  block:
    - name: Read the Remote Login startup setting before stopping
      ansible.builtin.command:
        argv: ["{{ remote_login_launchctl | default('/bin/launchctl') }}", print-disabled, system]
      register: remote_login_stop_overrides
      changed_when: false

    - name: Disable Remote Login at boot
      ansible.builtin.command:
        argv: ["{{ remote_login_launchctl | default('/bin/launchctl') }}", disable, system/com.openssh.sshd]
      when: remote_login_stop_overrides.stdout is not search('"com[.]openssh[.]sshd" => (disabled|true)')

    - name: Read the Remote Login listener before stopping
      ansible.builtin.command:
        argv: ["{{ remote_login_launchctl | default('/bin/launchctl') }}", print, system/com.openssh.sshd]
      register: remote_login_stop_service
      changed_when: false
      failed_when: remote_login_stop_service.rc not in [0, 113]

    - name: Unload the Remote Login listener
      ansible.builtin.command:
        argv: ["{{ remote_login_launchctl | default('/bin/launchctl') }}", bootout, system/com.openssh.sshd]
      when: remote_login_stop_service.rc == 0

    - name: Read the disabled Remote Login startup setting
      ansible.builtin.command:
        argv: ["{{ remote_login_launchctl | default('/bin/launchctl') }}", print-disabled, system]
      register: remote_login_stopped_overrides
      changed_when: false

    - name: Confirm Remote Login cannot start at boot
      ansible.builtin.assert:
        that: remote_login_stopped_overrides.stdout is search('"com[.]openssh[.]sshd" => (disabled|true)')
        fail_msg: Remote Login is not disabled. No SSH configuration or keys have been replaced.
        quiet: true

    - name: Confirm the Remote Login listener is unloaded
      ansible.builtin.command:
        argv: ["{{ remote_login_launchctl | default('/bin/launchctl') }}", print, system/com.openssh.sshd]
      register: remote_login_stopped_service
      changed_when: false
      failed_when: remote_login_stopped_service.rc != 113
