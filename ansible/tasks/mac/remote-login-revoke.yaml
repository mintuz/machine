---
# Imported only for the explicit macOS revoke_remote_login opt-in.
- name: Validate the Remote Login revocation request
  ansible.builtin.assert:
    that:
      - revoke_remote_login | default(false) | bool
      - ansible_facts['user_id'] != 'root'
    fail_msg: Run make remote-login-revoke as your normal user to revoke that account's SSH keys.
    quiet: true
  tags: [remote-login-revoke]

- name: Stop Remote Login before revoking keys
  ansible.builtin.import_tasks: remote-login-stop.yaml
  tags: [remote-login-revoke]

- name: Select an empty Remote Login key list
  ansible.builtin.set_fact:
    remote_login_authorized_keys: ""
  tags: [remote-login-revoke]

- name: Back up and clear this account's authorised keys
  ansible.builtin.import_tasks: remote-login-keys.yaml
  tags: [remote-login-revoke]

- name: Explain the Remote Login revocation result
  ansible.builtin.debug:
    msg: >-
      {{ 'Check mode only: Remote Login and authorised keys have not been changed.'
         if ansible_check_mode else
         'Remote Login startup and its listener are disabled. This account has no authorised SSH keys.' }}
      Existing SSH and mosh sessions may remain active. End those sessions
      separately from the local console when responding to an incident.
      Tailscale settings have not been changed.
  tags: [remote-login-revoke]
