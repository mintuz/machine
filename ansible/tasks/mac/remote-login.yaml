---
# Remote Login (SSH) from devices in the tailnet, for example an iPhone.
# local.yaml imports this file on macOS only when manage_remote_login is true.
# The SSH server is locked down before Remote Login is turned on.
- name: Validate Remote Login inputs
  ansible.builtin.assert:
    that:
      - ansible_facts['user_id'] != 'root'
      - remote_login_public_keys | default([]) | length > 0
      - remote_login_sources | default([]) | length > 0
    fail_msg: >-
      Run make remote-login as your normal user. In defaults.yaml, list at least
      one phone public key file from .ssh/ in remote_login_public_keys and at
      least one address range in remote_login_sources.
    quiet: true
  tags: [install, remote-login]

- name: Refuse private keys in the phone key list
  ansible.builtin.assert:
    that: lookup('ansible.builtin.file', playbook_dir ~ '/.ssh/' ~ item) is not search('PRIVATE KEY')
    fail_msg: "{{ item }} contains a private key. Keep only public keys in .ssh/."
    quiet: true
  loop: "{{ remote_login_public_keys }}"
  tags: [install, remote-login]

- name: Check that each phone key file holds one plain public key
  ansible.builtin.assert:
    that:
      - remote_login_key_lines | length == 1
      - remote_login_key_lines[0] is match('(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp(256|384|521)|sk-ssh-ed25519@openssh[.]com|sk-ecdsa-sha2-nistp256@openssh[.]com) [A-Za-z0-9+/]+=*( .*)?$')
    fail_msg: >-
      {{ item }} must hold exactly one line: a public key without options,
      for example "ssh-ed25519 AAAA... iphone".
    quiet: true
  loop: "{{ remote_login_public_keys }}"
  vars:
    remote_login_key_lines: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/.ssh/' ~ item) | trim | split('\n') }}"
  tags: [install, remote-login]

- name: Check the phone public keys
  ansible.builtin.command:
    argv: [/usr/bin/ssh-keygen, -l, -f, "{{ playbook_dir }}/.ssh/{{ item }}"]
  loop: "{{ remote_login_public_keys }}"
  changed_when: false
  check_mode: false
  tags: [install, remote-login]

- name: Read Tailscale status
  ansible.builtin.command:
    argv: ["{{ tailscale_cli }}", status, --json]
  register: remote_login_tailscale
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [install, remote-login]

- name: Check that Tailscale is connected
  ansible.builtin.assert:
    that:
      - remote_login_tailscale.rc == 0
      - (remote_login_tailscale.stdout | from_json).BackendState == 'Running'
    fail_msg: >-
      Tailscale is not installed at {{ tailscale_cli }} or is not connected.
      Open Tailscale, sign in, connect, and run make remote-login again.
    quiet: true
  tags: [install, remote-login]

- name: Find the Homebrew prefix
  ansible.builtin.command: brew --prefix
  register: remote_login_brew
  changed_when: false
  check_mode: false
  tags: [install, remote-login]

- name: Select the Remote Login settings
  ansible.builtin.set_fact:
    remote_login_allow_users: "{{ [ansible_facts['user_id']] | product(remote_login_sources) | map('join', '@') | list }}"
    remote_login_path: "{{ [ansible_facts['env']['HOME'] ~ '/.local/bin', remote_login_brew.stdout ~ '/bin', '/usr/local/bin', '/usr/bin', '/bin', '/usr/sbin', '/sbin'] | unique | join(':') }}"
    remote_login_authorized_keys: "{{ (['# Managed by mac-dev-machine-setup. make remote-login replaces this file.']
      + query('ansible.builtin.file', *([playbook_dir ~ '/.ssh'] | product(remote_login_public_keys) | map('join', '/') | list))
      | map('trim') | list) | join('\n') ~ '\n' }}"
  tags: [install, remote-login]

- name: Create SSH host keys
  ansible.builtin.command: /usr/bin/ssh-keygen -A
  args:
    creates: /etc/ssh/ssh_host_ed25519_key
  become: true
  tags: [install, remote-login]

- name: Deploy the checked Remote Login configuration
  ansible.builtin.import_tasks: remote-login-config.yaml
  tags: [install, remote-login]

- name: Back up and install the phone public keys
  ansible.builtin.import_tasks: remote-login-keys.yaml
  tags: [install, remote-login]

- name: Read the Remote Login access list
  ansible.builtin.command: /usr/bin/dscl . -read /Groups/com.apple.access_ssh GroupMembership NestedGroups
  register: remote_login_access
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [install, remote-login]

- name: Allow only this account to use Remote Login
  ansible.builtin.shell: |
    set -eu
    group=com.apple.access_ssh
    if ! /usr/bin/dscl . -read "/Groups/$group" >/dev/null 2>&1; then
      /usr/sbin/dseditgroup -o create -q -r "SSH Service ACL" -c "SSH Service ACL" "$group"
    fi
    /usr/sbin/dseditgroup -o edit -a "$REMOTE_LOGIN_USER" -t user "$group"
    for member in $(/usr/bin/dscl . -read "/Groups/$group" GroupMembership 2>/dev/null |
        /usr/bin/sed -n 's/^GroupMembership: //p'); do
      if [ "$member" != "$REMOTE_LOGIN_USER" ]; then
        /usr/sbin/dseditgroup -o edit -q -d "$member" -t user "$group"
      fi
    done
    for guid in $(/usr/bin/dscl . -read "/Groups/$group" NestedGroups 2>/dev/null |
        /usr/bin/sed -n 's/^NestedGroups: //p'); do
      name=$(/usr/bin/dscl . -search /Groups GeneratedUID "$guid" | /usr/bin/awk 'NR == 1 { print $1 }')
      if [ -n "$name" ]; then
        /usr/sbin/dseditgroup -o edit -q -d "$name" -t group "$group"
      else
        /usr/bin/dscl . -delete "/Groups/$group" NestedGroups "$guid"
      fi
    done
  environment:
    REMOTE_LOGIN_USER: "{{ ansible_facts['user_id'] }}"
  become: true
  when: >-
    remote_login_access.rc != 0
    or remote_login_access.stdout is not search('(?m)^GroupMembership: ' ~ (ansible_facts['user_id'] | regex_escape) ~ '$')
    or remote_login_access.stdout is search('(?m)^NestedGroups:')
  tags: [install, remote-login]

- name: Turn on Remote Login after all access checks
  become: true
  when: not ansible_check_mode
  tags: [install, remote-login]
  block:
    - name: Start Remote Login at boot
      ansible.builtin.command:
        argv: ["{{ remote_login_launchctl | default('/bin/launchctl') }}", enable, system/com.openssh.sshd]

    - name: Start Remote Login now
      ansible.builtin.command:
        argv: ["{{ remote_login_launchctl | default('/bin/launchctl') }}", bootstrap, system, /System/Library/LaunchDaemons/ssh.plist]

    - name: Wait for the SSH port
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 22
        timeout: 15
  rescue:
    - name: Remember the Remote Login activation failure
      ansible.builtin.set_fact:
        remote_login_activation_failure: "{{ ansible_failed_result }}"

    - name: Disable Remote Login after activation failed
      block:
        - name: Stop the failed Remote Login activation
          ansible.builtin.import_tasks: remote-login-stop.yaml
      rescue:
        - name: Report the activation and shutdown failures
          ansible.builtin.fail:
            msg: >-
              Remote Login activation failed and its shutdown could not be confirmed:
              {{ ansible_failed_result.msg | default('unknown shutdown error') }}.
              Use the local console to disable Remote Login before fixing the error.
              Original activation failure:
              {{ remote_login_activation_failure.msg | default('unknown activation error') }}
              {{ remote_login_activation_failure.stderr | default('') }}

    - name: Report the Remote Login activation failure
      ansible.builtin.fail:
        msg: >-
          Remote Login activation failed and it has been disabled again.
          Fix the error and run make remote-login again from the local console;
          do not bypass the checks by enabling it manually. Original failure:
          {{ remote_login_activation_failure.msg | default('unknown activation error') }}
          {{ remote_login_activation_failure.stderr | default('') }}

- name: Find the SSH host public keys
  ansible.builtin.find:
    paths: /etc/ssh
    patterns: ssh_host_*_key.pub
  register: remote_login_host_keys
  tags: [install, remote-login]

- name: Read the SSH host key fingerprints
  ansible.builtin.command:
    argv: [/usr/bin/ssh-keygen, -l, -f, "{{ item }}"]
  loop: "{{ remote_login_host_keys.files | map(attribute='path') | sort }}"
  register: remote_login_fingerprints
  changed_when: false
  check_mode: false
  tags: [install, remote-login]

- name: Find mosh-server and herdr on the SSH path
  ansible.builtin.command:
    argv: [/bin/sh, -c, 'command -v "$1"', sh, "{{ item }}"]
  environment:
    PATH: "{{ remote_login_path }}"
  loop: [mosh-server, herdr]
  register: remote_login_tools
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [install, remote-login]

- name: Show the connection details
  ansible.builtin.debug:
    msg: "{{ ['Host: ' ~ (remote_login_self.DNSName | regex_replace('[.]$', '')) ~ ' (' ~ (remote_login_self.TailscaleIPs | join(', ')) ~ ')',
              'User: ' ~ ansible_facts['user_id'],
              'Compare these host key fingerprints when an app connects for the first time:']
             + ((remote_login_fingerprints.results | map(attribute='stdout') | list) or ['The host keys do not exist yet.'])
             + (remote_login_tools.results | rejectattr('rc', 'equalto', 0) | map(attribute='item')
                | map('extract', remote_login_tool_hints) | list)
             + ['Shields Up is unchanged. Before allowing incoming connections, complete the policy and firewall checks in \"Remote access from an iPhone\" in README.md.'] }}"
  vars:
    remote_login_self: "{{ (remote_login_tailscale.stdout | from_json).Self }}"
    remote_login_tool_hints:
      mosh-server: "mosh-server is not on the SSH PATH. Run make cli to install mosh."
      herdr: "herdr is not on the SSH PATH. Install it from https://herdr.dev."
  tags: [install, remote-login]
