- name: Install zsh
  when: platform == 'mac'
  community.general.homebrew:
    name: ["zsh"]
  tags:
    - install
    - zsh
    - productivity

- name: Change shell to zsh
  ansible.builtin.command: chsh -s {{ shell_path }} "{{ ansible_facts['user_id'] }}"
  changed_when: true
  when: (ansible_facts['env']['SHELL'] | default('') | basename) != "zsh"
  tags:
    - install
    - zsh
    - productivity
  become: true

- name: Check to see if oh-my-zsh is already installed
  stat:
    path: ~/.oh-my-zsh
  register: oh_my_zsh
  tags:
    - install
    - zsh
    - productivity

- name: Ensure the installer cache directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.cache"
    state: directory
    mode: "0700"
  when: not oh_my_zsh.stat.exists
  tags: [install, zsh, productivity]

- name: Install oh-my-zsh
  when: not oh_my_zsh.stat.exists
  tags: [install, zsh, productivity]
  block:
    - name: Download the oh-my-zsh installer
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh
        dest: "{{ ansible_facts['env']['HOME'] }}/.cache/oh-my-zsh-install.sh"
        mode: "0700"

    - name: Run the oh-my-zsh installer
      ansible.builtin.command: sh "{{ ansible_facts['env']['HOME'] }}/.cache/oh-my-zsh-install.sh"
      environment:
        RUNZSH: "no"
        CHSH: "no"
        KEEP_ZSHRC: "yes"
      changed_when: true
  always:
    - name: Remove the downloaded installer
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.cache/oh-my-zsh-install.sh"
        state: absent

- name: Install zsh-autosuggestions
  ansible.builtin.git:
    repo: "https://github.com/zsh-users/zsh-autosuggestions.git"
    dest: "~/.oh-my-zsh/custom/plugins/zsh-autosuggestions"
    version: master
  tags:
    - install
    - zsh
    - productivity

- name: Enable oh-my-zsh on Ubuntu
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.zshrc"
    create: true
    mode: "0644"
    marker: "# {mark} dev-machine oh-my-zsh"
    block: |
      export ZSH="$HOME/.oh-my-zsh"
      plugins=(git zsh-autosuggestions)
      source "$ZSH/oh-my-zsh.sh"
  when: platform == 'linux'
  tags: [install, zsh, productivity]
