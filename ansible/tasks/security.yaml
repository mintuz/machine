- name: Validate managed SSH inputs
  ansible.builtin.assert:
    that:
      - ssh_agent_socket | default('') | length > 0
      - lookup('ansible.builtin.file', playbook_dir ~ '/.ssh/' ~ personal_public_ssh_key) | length > 0
      - lookup('ansible.builtin.file', playbook_dir ~ '/.ssh/' ~ work_public_ssh_key) | length > 0
    fail_msg: "Managed SSH requires an agent socket and both public key files."
    quiet: true
  tags: [install, ssh, security]

- name: Backup existing SSH configuration
  tags:
    - install
    - ssh
    - security
  block:
    - name: Check for existing SSH directory
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.ssh"
      register: ssh_dir_check

    - name: Create backup directory
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.dev-setup-backups/{{ ansible_facts['date_time']['iso8601_basic'] }}"
        state: directory
        mode: "0700"
      when: ssh_dir_check.stat.exists

    - name: Backup existing SSH directory
      ansible.builtin.command:
        argv:
          - rsync
          - -a
          - --exclude=agent/
          - "{{ ansible_facts['env']['HOME'] }}/.ssh/"
          - "{{ ansible_facts['env']['HOME'] }}/.dev-setup-backups/{{ ansible_facts['date_time']['iso8601_basic'] }}/ssh/"
      register: ssh_backup_result
      changed_when: ssh_backup_result.rc == 0
      when: ssh_dir_check.stat.exists

- name: Ensure SSH directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.ssh"
    state: directory
    mode: "0700"
  tags:
    - install
    - ssh
    - security

- name: Use 1Password SSH Agent
  ansible.builtin.template:
    src: ../templates/ssh_config.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.ssh/config"
    mode: "0600"
  tags:
    - install
    - ssh
    - security
- name: Install personal public SSH Key
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/.ssh/{{ personal_public_ssh_key }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/.ssh/{{ personal_public_ssh_key }}"
    mode: "0600"
  tags:
    - install
    - ssh
    - security
- name: Install work public SSH Key
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/.ssh/{{ work_public_ssh_key }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/.ssh/{{ work_public_ssh_key }}"
    mode: "0600"
  tags:
    - install
    - ssh
    - security
