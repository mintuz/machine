- name: Install stow
  community.general.homebrew:
    name: ["stow"]
  tags:
    - install
    - dotfiles
    - stow
    - cli

- name: Cloning .dotfiles
  ansible.builtin.git:
    repo: "{{ dotfiles_repo }}"
    dest: "{{ lookup('env', 'HOME') }}/.dotfiles"
    recursive: yes
    update: yes
    accept_hostkey: yes
    force: no
    version: "{{ dotfiles_version }}"
  tags:
    - install
    - dotfiles
    - stow
    - cli

- name: Find macOS metadata files in dotfiles checkout
  ansible.builtin.find:
    paths: "{{ ansible_facts['env']['HOME'] }}/.dotfiles"
    patterns: ".DS_Store"
    hidden: true
    recurse: true
    file_type: file
  register: dotfiles_macos_metadata
  tags:
    - install
    - dotfiles
    - stow
    - cli

- name: Remove macOS metadata files before stow
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ dotfiles_macos_metadata.files }}"
  loop_control:
    label: "{{ item.path | regex_replace('^' ~ ansible_facts['env']['HOME'] ~ '/', '~/') }}"
  tags:
    - install
    - dotfiles
    - stow
    - cli

- name: Ensure dotfiles backup directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.dev-setup-backups/{{ ansible_facts['date_time']['iso8601_basic'] }}/dotfiles"
    state: directory
    mode: "0755"
  when: dotfiles_conflict_paths | default([]) | length > 0
  tags:
    - install
    - dotfiles
    - stow
    - cli

- name: Back up existing dotfile conflicts before stow
  ansible.builtin.shell: |
    set -euo pipefail
    target="{{ ansible_facts['env']['HOME'] }}/{{ item }}"
    backup="{{ ansible_facts['env']['HOME'] }}/.dev-setup-backups/{{ ansible_facts['date_time']['iso8601_basic'] }}/dotfiles/{{ item }}"

    if [ -e "$target" ] && [ ! -L "$target" ]; then
      mkdir -p "$(dirname "$backup")"
      mv "$target" "$backup"
      echo "$target -> $backup"
    fi
  args:
    executable: /bin/bash
  loop: "{{ dotfiles_conflict_paths | default([]) }}"
  register: dotfiles_conflict_backup
  changed_when: dotfiles_conflict_backup.stdout != ""
  tags:
    - install
    - dotfiles
    - stow
    - cli

- name: Stow dotfiles
  ansible.builtin.shell: cd "$HOME/.dotfiles" && ./install.sh
  args:
    executable: /bin/bash
  changed_when: true
  tags:
    - install
    - dotfiles
    - stow
    - cli
