- name: Install nvm
  community.general.homebrew:
    name: nvm
    state: latest
  tags:
    - install
    - node

- name: Ensure nvm directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.nvm"
    state: directory
    mode: "0755"
  tags:
    - install
    - node

- name: Install latest lts version of node
  ansible.builtin.shell: |
    set -e
    export NVM_DIR="{{ ansible_facts['env']['HOME'] }}/.nvm"
    source "$(brew --prefix nvm)/nvm.sh" --no-use
    nvm install --lts
    nvm alias default 'lts/*'
  args:
    executable: /bin/bash
  tags:
    - install
    - node

- name: Unlink Homebrew node so nvm controls the Node version
  ansible.builtin.import_tasks: brew-unlink-node.yaml
  tags:
    - install
    - node

- name: Ensure pnpm global bin directory exists
  ansible.builtin.file:
    path: "{{ pnpm_home }}/bin"
    state: directory
    mode: "0755"
  tags:
    - install
    - node

- name: Install or update pnpm global packages
  ansible.builtin.shell: |
    set -e
    export NVM_DIR="{{ ansible_facts['env']['HOME'] }}/.nvm"
    export PNPM_HOME="{{ pnpm_home }}"
    export PATH="$PNPM_HOME/bin:$PNPM_HOME:$PATH"
    source "$(brew --prefix nvm)/nvm.sh"
    pnpm add -g {{ (item ~ "@latest") | quote }}
  args:
    executable: /bin/bash
  loop: "{{ pnpm_global_packages }}"
  when: pnpm_global_packages | length > 0
  tags:
    - install
    - node

- name: Configure Node and pnpm in the Ubuntu shell
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/{{ item }}"
    create: true
    mode: "0644"
    marker: "# {mark} dev-machine Node and pnpm"
    block: |
      export NVM_DIR="$HOME/.nvm"
      [ ! -s "$(brew --prefix nvm)/nvm.sh" ] || . "$(brew --prefix nvm)/nvm.sh"
      export PNPM_HOME="{{ pnpm_home }}"
      export PATH="$PNPM_HOME/bin:$PNPM_HOME:$PATH"
  loop: [.bashrc, .zshrc]
  when: platform == 'linux'
  tags: [install, node]
