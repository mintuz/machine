# Managed by mac-dev-machine-setup. The remote-login task replaces this file.
# Settings in a Match block override the global settings in every file, and
# for most settings the first matching block wins. This file sorts before
# 100-macos.conf. The remote-login task stops if any other Match block exists,
# because every matching AllowUsers line adds to the list.
Match all
    AllowUsers ${allow_users}
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile .ssh/authorized_keys
    AuthorizedKeysCommand none
    TrustedUserCAKeys none
    # Commands that run without a login shell, such as mosh-server and herdr,
    # need ~/.local/bin, mise-managed tools and Homebrew. ~/.local/bin comes
    # first, as in the interactive shell, so that SSH finds the same herdr as
    # the terminal.
    SetEnv PATH=${remote_login_path}
